; liblsl configuration for the test session on macOS (tests/conftest.py points
; LSLAPICFG here unless the caller already set it). Every outlet and resolver
; of the test suite is on this machine; "Discovery" in the docstring of
; tests/test_lsl_streaming.py has the measurements behind the setting.

; Send each discovery query straight to every port an outlet on this machine
; can listen on (16572 and up), as well as to the shared discovery port 16571,
; so that finding an outlet does not depend on multicast delivery to that
; port.
[lab]
KnownPeers = {127.0.0.1}
