# Published defaults for hypertools' main dispatcher functions. These MIRROR
# the defaults defined in each function's signature (the signatures are the
# mechanism that sets them; this file is the queryable record). Agreement is
# enforced by tests/test_core_audit_fixes.py -- if you change a signature
# default, update the matching entry here (and vice versa).
#
# Option names match the actual keyword arguments. Values are parsed with
# ast.literal_eval where possible (3 -> int, None -> None, False -> bool);
# everything else stays a string.

[plot]
fmt = -

[reduce]
reduce = IncrementalPCA
ndims = None

[align]
model = HyperAlign

[cluster]
cluster = KMeans
n_clusters = 3
